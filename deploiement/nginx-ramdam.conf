# Ramdam sur le VPS : l'app web (fichiers statiques) et l'API (NestJS, port 3003) sous /api.
# Installé dans /etc/nginx/sites-available/ramdam.
#
# Adresse publique : https://ramdam.online (certificat Let's Encrypt, renouvelé par certbot).
# HTTPS est obligatoire pour que le téléphone installe Ramdam comme une app (PWA), et pour que
# les mots de passe et les jetons ne circulent pas en clair.
#
# Toutes les autres adresses redirigent vers https://ramdam.online (301 : redirection définitive) :
# - www.ramdam.online ;
# - l'ancienne adresse https://159-195-247-184.sslip.io, utilisée avant l'achat du domaine
#   (son certificat est gardé pour que les apps déjà installées suivent la redirection) ;
# - l'adresse IP et l'ancien port 8080, en HTTP.

# HTTP (ports 80 et 8080) : tout part vers HTTPS.
server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;
    server_name ramdam.online www.ramdam.online 159-195-247-184.sslip.io
                v2202609408683511116.supersrv.de 159.195.247.184;

    return 301 https://ramdam.online$request_uri;
}

# HTTPS des anciennes adresses : redirigées vers le domaine.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ramdam.online;

    ssl_certificate /etc/letsencrypt/live/ramdam.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ramdam.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ramdam.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 159-195-247-184.sslip.io;

    ssl_certificate /etc/letsencrypt/live/159-195-247-184.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/159-195-247-184.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ramdam.online$request_uri;
}

# Le site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ramdam.online;

    ssl_certificate /etc/letsencrypt/live/ramdam.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ramdam.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS : le navigateur n'essaiera plus jamais HTTP pour cette adresse (6 mois).
    add_header Strict-Transport-Security "max-age=15552000" always;

    root /var/www/ramdam/web;
    index index.html;

    # Photos envoyées : 15 Mo au plus dans l'API, plus l'enveloppe de la requête.
    client_max_body_size 16m;

    location /api/ {
        # La barre finale retire « /api » : /api/fiches arrive dans l'API comme /fiches.
        proxy_pass http://127.0.0.1:3003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers de l'app avec un nom qui change à chaque version : gardés en cache un an.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    # Le manifeste de l'app installable : type MIME attendu par les navigateurs.
    location = /manifest.json {
        types { application/manifest+json json; }
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    # Application d'une seule page : toute adresse inconnue renvoie index.html,
    # et c'est Expo Router qui affiche le bon écran.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
