# Ramdam sur le VPS : l'app web (fichiers statiques) et l'API (NestJS, port 3003) sous /api.
# Installé dans /etc/nginx/sites-available/ramdam ; certbot ajoute ensuite le bloc HTTPS (443).
server {
    listen 80;
    listen [::]:80;
    # Le port 8080 reprend l'adresse de l'ancien projet asobi : http://159.195.247.184:8080
    listen 8080;
    listen [::]:8080;
    server_name v2202609408683511116.supersrv.de 159.195.247.184;

    root /var/www/ramdam/web;
    index index.html;

    # Photos envoyées : 15 Mo au plus dans l'API, plus l'enveloppe de la requête.
    client_max_body_size 16m;

    location /api/ {
        # La barre finale retire « /api » : /api/fiches arrive dans l'API comme /fiches.
        proxy_pass http://127.0.0.1:3003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers de l'app avec un nom qui change à chaque version : gardés en cache un an.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application d'une seule page : toute adresse inconnue renvoie index.html,
    # et c'est Expo Router qui affiche le bon écran.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
