# Services de développement : base relationnelle, cache NoSQL et stockage d'images.
# Lancer avec `pnpm db:up` après avoir copié .env.example en .env.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data

  # Pas encore utilisé par l'API : lancé seulement avec « docker compose --profile stockage up -d ».
  # L'image officielle n'est plus publiée sur Docker Hub, à remplacer quand l'upload d'images arrivera.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ['stockage']
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
